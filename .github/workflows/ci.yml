name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/write-local-env.mjs
      - run: pnpm proto:generate
      - run: git diff --exit-code -- packages/proto/gen
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @doorward/web build

  e2e-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: doorward
          POSTGRES_PASSWORD: doorward
          POSTGRES_DB: doorward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doorward -d doorward"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_KIND: postgres
      DATABASE_URL: postgresql://doorward:doorward@127.0.0.1:5432/doorward
      JWT_SECRET: ci-secret-not-for-production
      COOKIE_SECURE: "false"
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: 3001
      GRPC_PORT: 5581
      GRPC_TLS: "false"
      CORS_ORIGIN: http://localhost:3000
      SMOKE_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: node scripts/write-local-env.mjs
      - run: node scripts/apply-job-database-env.mjs
      - run: pnpm --filter @doorward/domain build && pnpm --filter @doorward/api build
      # Build the schema the way the pre-migration install script did, then let the runner adopt it.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/test/fixtures/legacy-03-postgres.sql
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @doorward/api start:prod &
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3001/api/health && exit 0
            sleep 1
          done
          exit 1
      - run: pnpm --filter @doorward/api test:e2e
      - run: bash scripts/smoke-http.sh
      - name: Migration probe (a new file applies, then the database is ahead of the code)
        run: |
          probe="db/postgres/migrations/$(printf '%04d' $(( $(ls db/postgres/migrations | wc -l) + 1 )))_ci_probe.sql"
          printf 'CREATE TABLE users.ci_probe (id int);\n' > "$probe"
          pnpm db:migrate
          pnpm db:migrate:status
          rm "$probe"
          if pnpm db:migrate:status; then echo "expected the database to be ahead of the code"; exit 1; fi

  e2e-mssql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Doorward_Dev_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Doorward_Dev_Passw0rd! -Q 'SELECT 1' -b -o /dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    env:
      DATABASE_KIND: mssql
      DATABASE_URL: mssql://doorward:doorward@127.0.0.1:1433/doorward
      JWT_SECRET: ci-secret-not-for-production
      COOKIE_SECURE: "false"
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: 3001
      GRPC_PORT: 5581
      GRPC_TLS: "false"
      CORS_ORIGIN: http://localhost:3000
      SMOKE_BASE_URL: http://127.0.0.1:3001
      MSSQL_SA_PASSWORD: Doorward_Dev_Passw0rd!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Apply MSSQL pack
        run: |
          docker run --rm --network host \
            -e MSSQL_HOST=127.0.0.1 \
            -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            -e MSSQL_DOORWARD_PASSWORD=doorward \
            -v "$PWD/db/mssql:/scripts:ro" \
            -v "$PWD/deploy/compose/mssql-init.sh:/mssql-init.sh:ro" \
            --entrypoint bash \
            mcr.microsoft.com/mssql/server:2022-latest \
            /mssql-init.sh
      - run: pnpm install --frozen-lockfile
      - run: node scripts/write-local-env.mjs
      - run: node scripts/apply-job-database-env.mjs
      - run: pnpm --filter @doorward/domain build && pnpm --filter @doorward/api build
      # Build the schema the way the pre-migration install script did, then let the runner adopt it.
      - name: Apply legacy schema
        run: |
          docker run --rm --network host \
            -v "$PWD/apps/api/test/fixtures:/fixtures:ro" \
            --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2022-latest \
            -C -S 127.0.0.1 -U doorward -P doorward -b -i /fixtures/legacy-03-mssql.sql
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @doorward/api start:prod &
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3001/api/health && exit 0
            sleep 1
          done
          exit 1
      - run: pnpm --filter @doorward/api test:e2e
      - run: bash scripts/smoke-http.sh
      - name: Migration probe (a new file applies, then the database is ahead of the code)
        run: |
          probe="db/mssql/migrations/$(printf '%04d' $(( $(ls db/mssql/migrations | wc -l) + 1 )))_ci_probe.sql"
          printf 'CREATE TABLE users.ci_probe (id int);\nGO\n' > "$probe"
          pnpm db:migrate
          pnpm db:migrate:status
          rm "$probe"
          if pnpm db:migrate:status; then echo "expected the database to be ahead of the code"; exit 1; fi

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # On a v* tag the semver rule gives <version> (no leading v) and latest. Branch pushes get no tags and only build.
      - id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chasanc/doorward-api
          tags: type=semver,pattern={{version}}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/compose/Dockerfile.api
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.api-meta.outputs.tags }}
      - id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chasanc/doorward-web
          tags: type=semver,pattern={{version}}
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/compose/Dockerfile.web
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.web-meta.outputs.tags }}
