name: doorward

services:
  postgres:
    profiles: [postgres]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.postgres
    image: doorward-postgres:local
    environment:
      POSTGRES_USER: doorward
      POSTGRES_PASSWORD: doorward
      POSTGRES_DB: doorward
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorward -d doorward"]
      interval: 5s
      timeout: 5s
      retries: 20

  mssql:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Doorward_Dev_Passw0rd!}
    ports:
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  mssql-init:
    profiles: [mssql]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.mssql-init
    image: doorward-mssql-init:local
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_HOST: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Doorward_Dev_Passw0rd!}
      MSSQL_DOORWARD_PASSWORD: doorward

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.api
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3001
      GRPC_PORT: 5581
      GRPC_TLS: "false"
      GRPC_TLS_CA: ""
      GRPC_TLS_CERT: ""
      GRPC_TLS_KEY: ""
      GRPC_TLS_REQUIRE_CLIENT_CERT: "false"
      # Do not interpolate host DATABASE_URL — a local .env often points at
      # 127.0.0.1 and would break in-network DNS (postgres / mssql).
      # The entrypoint writes these into .env files. The API reads only those files.
      DATABASE_KIND: ${DOORWARD_DATABASE_KIND:-postgres}
      DATABASE_URL: ${DOORWARD_DATABASE_URL:-postgresql://doorward:doorward@postgres:5432/doorward}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: 1d
      COOKIE_SECURE: "false"
      MULTI_COMPANY_MODE: "false"
      RATE_LIMIT_ENABLED: "false"
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      LOG_LEVEL: info
      # Optional log switches and tracing (docs/logging.md). Empty OTLP endpoint = tracing off.
      LOG_HTTP_REQUESTS: ${LOG_HTTP_REQUESTS:-true}
      LOG_STARTUP: ${LOG_STARTUP:-true}
      LOG_AUTH_FAILURES: ${LOG_AUTH_FAILURES:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      CORS_ORIGIN: http://localhost:3000
      GRPC_API_KEY: ${GRPC_API_KEY:-}
      # Single sign-on and two-step verification stay off unless these are set (docs/deploy.md).
      TRUST_PROXY: ${TRUST_PROXY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_COOKIE_KEYS: ${OIDC_COOKIE_KEYS:-}
      OIDC_SIGNING_KEY_JSON: ${OIDC_SIGNING_KEY_JSON:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
    ports:
      - "3001:3001"
      - "5581:5581"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mssql-init:
        condition: service_completed_successfully
        required: false

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      API_INTERNAL_URL: http://api:3001/api
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  mssqldata:
